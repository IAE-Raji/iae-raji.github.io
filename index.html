<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081722">
<title>NanoBio Materials | Choose language</title>
<style>
*{box-sizing:border-box}
:root{--ink:#081722;--cyan:#18c6c8;--amber:#ffb547;--white:#fff}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(1rem,4vw,2rem);color:#fff;background:radial-gradient(circle at 78% 17%,rgba(24,198,200,.28),transparent 31%),radial-gradient(circle at 12% 88%,rgba(255,181,71,.13),transparent 28%),linear-gradient(125deg,#081722,#0f3240);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.panel{width:min(900px,100%);padding:clamp(1.4rem,5vw,3.25rem);border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(255,255,255,.065);box-shadow:0 30px 90px rgba(0,0,0,.33);backdrop-filter:blur(12px)}
.selector-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:clamp(1.8rem,5vw,3.3rem);align-items:center}
.profile-wrap{display:flex;flex-direction:column;align-items:center;gap:0}.photo-frame{width:164px;aspect-ratio:1;overflow:hidden;border:1px solid rgba(255,255,255,.2);border-radius:26px;background:rgba(255,255,255,.08);box-shadow:14px 16px 0 rgba(24,198,200,.92)}.photo-frame img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 24%}
.content{text-align:left}h1{margin:0;font:400 clamp(2.7rem,6.5vw,5rem)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.045em}h1 span{color:var(--amber)}
.person{margin:1rem 0 0;font-size:1.05rem;font-weight:850}.position{margin:.22rem 0 0;color:rgba(255,255,255,.88);font-size:.88rem;font-weight:750;letter-spacing:.015em}.affiliation{max-width:620px;margin:.25rem 0 0;color:rgba(255,255,255,.64);font-size:.85rem;line-height:1.55}.title-translations{display:flex;flex-wrap:wrap;gap:.45rem .8rem;margin:.62rem 0 0;color:rgba(255,255,255,.7);font-size:.8rem;font-weight:700}.title-translations .ta{font-family:"Noto Sans Tamil","Nirmala UI",sans-serif}.title-translations .ja{font-family:"Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif}
.language-prompt{display:grid;gap:.2rem;margin:1.65rem 0 1.25rem;padding:1rem 0;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);text-align:center}.language-prompt span{display:block;line-height:1.5}.language-prompt .ta{font-family:"Noto Sans Tamil","Nirmala UI",sans-serif;font-size:1.02rem;font-weight:700;color:#fff}.language-prompt .en{font-size:.9rem;font-weight:700;color:rgba(255,255,255,.68);letter-spacing:.04em}.language-prompt .ja{font-family:"Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif;font-size:.98rem;font-weight:700;color:#fff}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}.choices a{display:flex;align-items:center;justify-content:center;min-height:52px;padding:.8rem .65rem;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:#fff;text-decoration:none;font-weight:850;transition:transform .2s ease,border-color .2s ease,background .2s ease}.choices a:first-child{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}.choices a:hover{transform:translateY(-2px);border-color:#fff}.choices a[lang=ta]{font-family:"Noto Sans Tamil","Nirmala UI",sans-serif}.choices a[lang=ja]{font-family:"Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif}
@media(max-width:700px){.panel{padding:1.5rem}.selector-grid{grid-template-columns:1fr;text-align:center}.profile-wrap{margin-bottom:.4rem}.photo-frame{width:132px;border-radius:22px;box-shadow:10px 12px 0 rgba(24,198,200,.92)}.content{text-align:center}.affiliation{margin-left:auto;margin-right:auto}.title-translations{justify-content:center}h1{font-size:clamp(2.55rem,12vw,4rem)}}
@media(max-width:520px){body{padding:.75rem}.panel{border-radius:22px;padding:1.25rem}.choices{grid-template-columns:1fr}.choices a{min-height:48px}.language-prompt{margin-top:1.35rem}.person{font-size:.98rem}.affiliation{font-size:.79rem}}
</style>
</head>
<body>
<main class="panel">
  <div class="selector-grid">
    <div class="profile-wrap">
      <div class="photo-frame"><img src="en/profile.webp" alt="Arivazhagan Rajendran"></div>
    </div>
    <div class="content">
      <h1>NanoBio <span>Materials</span></h1>
      <div class="title-translations" aria-label="Translated site title"><span class="ta" lang="ta">நானோ உயிரிப் பொருட்கள்</span><span aria-hidden="true">·</span><span class="ja" lang="ja">ナノバイオ材料</span></div>
      <p class="person">Dr. Arivazhagan Rajendran, Ph.D.</p>
      <p class="position">Junior Associate Professor</p>
      <p class="affiliation">Integrated Research Center for Carbon Negative Science, Institute of Advanced Energy, Kyoto University</p>
      <div class="language-prompt" aria-label="Choose your language">
        <span class="ta" lang="ta">மொழியைத் தேர்ந்தெடுக்கவும்</span>
        <span class="en" lang="en">Choose your language</span>
        <span class="ja" lang="ja">言語を選択してください</span>
      </div>
      <div class="choices">
        <a href="ta/index.html" lang="ta">தமிழ்</a>
        <a href="en/index.html" lang="en">English</a>
        <a href="ja/index.html" lang="ja">日本語</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
